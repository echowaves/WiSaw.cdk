schema: spec-driven

context: |
  Tech stack: TypeScript, AWS CDK, AWS AppSync (GraphQL), PostgreSQL + PostGIS, AWS Lambda, Node.js
  Package manager: npm
  Dependency versioning: ALL dependencies in package.json MUST use exact versions (no ^ or ~ prefixes).
  When adding or updating any dependency, always pin to the exact version (e.g. "express": "4.18.2", not "^4.18.2").

rules:
  tasks:
    - When any task involves adding or updating npm dependencies, always use exact version numbers (no ^ or ~) in package.json.
    - Always write code in a modular fashion, separating concerns into different files and components.
    - Lambda controller file names must match the corresponding GraphQL field name declared in schema.graphql (e.g., the mutation "autoGroupPhotosIntoWaves" must be implemented in a file named "autoGroupPhotosIntoWaves.ts").
    - Always include error handling and loading states for asynchronous operations (e.g., data fetching,
    - All generated code must have a maximum cyclomatic complexity of 8 or less. Refactor complex functions by extracting helper functions, using early returns, and breaking down conditional logic into smaller reusable pieces.
  graphql:
    - Every new GraphQL query/mutation field added to graphql/schema.graphql MUST be wired in ALL FOUR places simultaneously:
      1. graphql/schema.graphql — add the field to type Query or type Mutation
      2. lambda-fns/controllers/<name>.ts — create the controller function
      3. lambda-fns/index.ts — add import + entry in queryHandlers/mutationHandlers
      4. lib/resources/resolvers.ts — add { typeName: 'Query'|'Mutation', fieldName: '<name>' } to the fields array
    - CRITICAL: Missing the resolver entry in lib/resources/resolvers.ts causes AppSync to silently return null for the field. The Lambda is never invoked. This is the most commonly missed step and must NEVER be omitted.
    - When implementing ANY GraphQL operation, explicitly list all four files before making changes and verify each one is updated.
    

  dependencies:
    - Do not add any new dependencies to the project unless the user explicitly requests or approves it. Solve problems using existing dependencies and built-in APIs first.  
  security:
    - ".env* files must NEVER be committed to version control. They are listed in .gitignore and must stay there."
    - "Secrets, credentials, API keys, tokens, passwords, and any other sensitive values found in .env* files must NEVER be copied, referenced, or hardcoded into any versioned file (source code, config, documentation, specs, tasks, proposals, etc.)."
    - "When referencing environment variables in code, use process.env.VAR_NAME — never inline the actual secret value."
