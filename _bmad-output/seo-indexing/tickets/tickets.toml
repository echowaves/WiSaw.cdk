# Initiative-level entries (no epics). Table order is build order. `id` is permanent, never reused.

[[entry]]
id = 1
type = "bug"
title = "Deleting a photo leaves its images and SEO files live in storage"
description = "A user's photo delete only hides the photo in the database; its original image, thumbnails, and SEO sidecar stay in the media bucket and keep serving by direct URL. Deleting a photo must remove all of that photo's objects."
verify = "On the deployed test environment, deleting a photo stops its image, thumb, and sidecar URLs from serving, while another photo sharing its storage prefix keeps working and its indexed page keeps its SEO enrichment."
covers = []
after = []
hitl = true
risk = "high"

[[entry]]
id = 2
type = "bug"
title = "A new photo has no SEO sidecar until up to five hours after upload"
description = "Uploading a photo produces its image and thumb but no seo/<id>.json sidecar; enrichment waits for the scheduled publisher's next run, up to ~5 hours. The sidecar must be written by the upload processing as soon as the thumb is produced, while the scheduled publisher keeps refreshing it after later edits."
verify = "On the deployed test environment, uploading a photo leaves seo/<id>.json in the media bucket within a minute of its thumb appearing, with the publisher's fields and version (caption/labels empty); a forced sidecar-write failure still leaves the upload fully working."
covers = []
after = [1]
hitl = false
risk = "medium"
refine = true
refined = true

[[entry]]
id = 3
type = "story"
title = "Titles carry the AI tags, captions and descriptions carry the comments"
description = "Sitemap image and video entries, and the page title against the meta description, stop repeating one text: where a photo has both AI tags and a comment, each surface shows both — tags label the image, the comment headlines the page and captions it, and the description takes whichever of the two the title did not use."
verify = "Run `npm test`: the sitemap entry text and the edge injector's page-text cases show two different texts whenever a photo has both tags and a comment, and today's text when only one source exists; no new failures beyond the five known getSeasonBoundaries ones."
covers = []
after = [2]
hitl = false
risk = "medium"
refine = true
refined = true

[[entry]]
id = 4
type = "bug"
title = "The crawler head the edge writes is rewritten and duplicated by the browser render"
description = "On every media and static route the head written for crawlers is replaced when the app paints, because the two sides derive different values and tags the app did not stamp are never reconciled — leaving permanently duplicated site-name and robot tags. The head served at first byte must be the head a browser ends up holding, with one tag per property."
verify = "Run `npm test`: head-contract tests report exactly one og:site_name and one robots directive on a photo page and a video page, og:type valid and identical between served and rendered heads, and a duplicate-tag test that fails before the fix and passes after. A live curl of one photo page and of /about, compared with the hydrated DOM, shows matching values. No new failures beyond the five known getSeasonBoundaries ones."
covers = []
after = [3]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "bug"
title = "Sitemap video entries point at a .mov URL that may not exist"
description = "The sitemap names an assumed file extension for every video instead of the object that exists, while the edge resolves the real one. A video stored any other way publishes a working page and a sitemap media URL that 404s, damaging the Google Video entries. The file named in the sitemap must be the file that exists and matches its page."
verify = "Run `npm test`: sitemap tests produce content_loc matching the resolved media key for .mov, .mp4 and .webm objects; on the deployed test environment a video uploaded as .mp4 appears in sitemap.xml with its real URL. No new failures beyond the five known getSeasonBoundaries ones."
covers = []
after = [3]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "One SEO text source serves the sitemap, the edge head and the app"
description = "The wording rules behind titles, descriptions and captions are written three times — twice in this repo, once in the app — and have already drifted on character budgets, so the text a crawler is served is not the text a renderer sees. One source must produce them: enrichment writes finished strings, the edge renders what it is given, the app displays what it is served."
verify = "Run `npm test`: for one photo row, the sitemap entry text, the injected head text and the values reaching the app are byte-identical; a budget test proves truncation answers identically from both consumers; no sampled page loses title or description text it has today. No new failures beyond the five known getSeasonBoundaries ones."
covers = []
after = [4, 5]
hitl = true
risk = "high"

[[entry]]
id = 7
type = "story"
title = "Static-route SEO copy is written once and published to both sides"
description = "The copy for / , /about, /contact, /terms and /search is authored twice with different wording, so crawlers and browsers see different pages; search results are excluded at the edge while the app publishes them as indexable. One copy must serve both sides, and the exclusion decision must hold in the first byte and after render."
verify = "Run `npm test`: a contract check fails when the copy served for a static route differs from what the app renders for it; live curl of each static route matches the hydrated DOM, and search pages carry the exclusion directive in both. No new failures beyond the five known getSeasonBoundaries ones."
covers = []
after = [6]
hitl = true
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "Real video duration never reaches a page or its structured data"
description = "The length of a video exists only as upload-time object metadata that one edge path reads and discards into a log line; the sidecar, the API and the app have no place for it. Every surface that wants a duration omits one or invents one, so video pages cannot qualify for video rich results. The real duration must reach the structured data on the page."
verify = "Run `npm test`: a video row whose object carries a duration produces that duration in the sidecar, in the edge-injected VideoObject and in what the app renders for the same URL; a video with no recorded duration produces no duration anywhere rather than a guess. No new failures beyond the five known getSeasonBoundaries ones."
covers = []
after = [4]
hitl = false
risk = "medium"

[[entry]]
id = 9
type = "story"
title = "A newly uploaded video states no length until a later pass touches it"
description = "A brand-new video publishes its page with no length at all: the duration is learned only when a comment, the bounded scheduled pass, or the operator backfill reaches that row. Learning must also happen during upload processing, in the same invocation that produces the thumbnail and writes the enrichment record, so the first record published for a new video already states it."
verify = "On the deployed test environment, after someone deploys the changed processing function and uploads a video recorded through the real app: the row states the length read from its stored object and the published enrichment record carries it, within a minute of the thumbnail appearing, with no operator script run and no scheduled learning pass in between; a photo uploaded at the same time produces exactly what it produces today, and an unmeasured video's record stays byte-identical. No new failures beyond the five known getSeasonBoundaries ones."
covers = []
after = [8]
hitl = true
risk = "medium"
